<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vantagekit demo</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  html, body { margin: 0; height: 100%; background: #0a0a12; color: #d8dce6; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #panel { position: absolute; top: 12px; left: 12px; width: 260px; padding: 10px 12px; background: rgba(16, 18, 28, 0.88); border: 1px solid #2a2f40; border-radius: 6px; }
  #panel h1 { font-size: 14px; margin: 0 0 6px; }
  #panel label { display: block; margin: 6px 0 2px; color: #9aa3b8; }
  #panel select, #panel input[type=range] { width: 100%; }
  #keys { margin: 8px 0 0; padding: 0; list-style: none; color: #9aa3b8; font-size: 12px; }
  #keys b { color: #d8dce6; font-weight: 600; }
  #panel button { margin-top: 8px; width: 100%; padding: 5px; background: #1d3b52; color: #d8dce6; border: 1px solid #2f5d7f; border-radius: 4px; font: inherit; cursor: pointer; }
  #panel button:disabled { opacity: 0.45; cursor: default; }
  .hint { margin-top: 4px; color: #9aa3b8; font-size: 12px; }
  #status {margin-top: 8px; font: 12px ui-monospace, monospace; color: #8fc1ff; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <h1>vantagekit demo</h1>
  <div>An invented coastline, 20 km across: hills, a river valley, a shelf with a canyon, and an island.</div>
  <label for="modes">Modes offered (a page setting)</label>
  <select id="modes">
    <option value="orbit,fly">Orbit and fly</option>
    <option value="orbit">Orbit only</option>
    <option value="fly">Fly only</option>
  </select>
  <button id="fly" type="button">Fly (F)</button>
  <div id="fly-hint" class="hint"></div>
  <label for="sens">Fly mouse look <span id="sens-val"></span></label>
  <input id="sens" type="range" min="0.03" max="0.4" step="0.01">
  <label><input id="invert" type="checkbox"> Invert Y</label>
  <label for="mouse">Orbit mouse</label>
  <select id="mouse">
    <option value="rotate-left">Left rotates, right pans</option>
    <option value="pan-left">Left pans, right rotates</option>
  </select>
  <label for="scale">Metres per scene unit</label>
  <select id="scale">
    <option value="100">100</option>
    <option value="1">1</option>
  </select>
  <label for="exag">Vertical exaggeration <span id="exag-val">5x</span></label>
  <input id="exag" type="range" min="1" max="40" value="5">
  <label><input id="sea" type="checkbox" checked> Sea surface</label>
  <label><input id="link" type="checkbox" checked> Keep the camera in the URL</label>
  <ul id="keys"></ul>
  <div id="status"></div>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "camera-controls": "https://cdn.jsdelivr.net/npm/camera-controls@3.1.2/dist/camera-controls.module.min.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import CameraControls from 'camera-controls';
import { createVantage } from '../vantagekit-three.js';

const ORIGIN = { lon: -70.5, lat: 42.5 };   // an arbitrary open-ocean point
const SPAN_M = 20000;
const N = 256;
const params = new URLSearchParams(location.search);
const sel = (id) => document.getElementById(id);
sel('mouse').value = params.get('mouse') || 'rotate-left';
sel('scale').value = params.get('mpu') || '100';
sel('exag').value = params.get('ex') || '5';
sel('modes').value = params.get('modes') || 'orbit,fly';
let startMode = params.get('mode') || null;   // ?mode=fly starts in fly mode

const canvas = sel('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0d16);
scene.add(new THREE.HemisphereLight(0xb8c8e0, 0x6a5540, 0.9));   // undersides stay visible
const sun = new THREE.DirectionalLight(0xffffff, 1.1);
sun.position.set(-1, 2, 1.2);
scene.add(sun);
const camera = new THREE.PerspectiveCamera(55, 1, 0.01, 1e6);

// ---- Synthetic coastline -------------------------------------------------------------------
// Invented terrain, 20 km square, heights in metres (x east, y north, origin at the centre):
// hills and a river valley on land to the east, a beach, a shallow shelf with a nearshore bar,
// a submarine canyon running out from the river mouth, an offshore island, and the shelf break
// falling to about 450 m in the west.

const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const gauss = (d, s) => Math.exp(-(d * d) / (2 * s * s));
// Low-amplitude texture from incommensurate sines (deterministic, no noise library).
const texture = (x, y) =>
  Math.sin(x / 610 + 1.3) * Math.cos(y / 470 - 0.7) + 0.6 * Math.sin((x + y) / 330) * Math.cos((x - y) / 270 + 2.1);

const RIVER_Y = 1500;   // the river and canyon axis, metres north

function coastX(y) {   // the shoreline: a gentle bay and a headland
  return 2500 + 900 * Math.sin(y / 3200) - 1100 * gauss(y + 5200, 1700) + 700 * gauss(y - 6500, 1200);
}

function heightAt(x, y) {
  const d = x - coastX(y);                  // metres inland (+) or offshore (-)
  if (d >= 0) {
    // Land: a beach rising into rolling hills, cut by a river valley.
    const inland = smooth(0, 2500, d);
    const hills = 110 * gauss(Math.hypot(x - 7200, y - 5200), 1500) + 140 * gauss(Math.hypot(x - 8200, y + 3600), 1900)
      + 70 * gauss(Math.hypot(x - 5200, y + 7800), 1100);
    const rise = 3 + 90 * smooth(0, 6000, d) + hills * inland + 18 * (texture(x * 0.8, y * 0.8) + 1.6) / 3.2 * inland;   // texture only adds height
    // The valley takes at most 60 % of the local height, so its floor stays above the beach.
    const valley = 0.6 * rise * gauss(y - RIVER_Y - 0.15 * d, 260 + 0.05 * d) * smooth(300, 2500, d);
    return Math.max(0.5, rise - valley);
  }
  const s = -d;                             // metres offshore
  // Shelf: 0.5 % slope to the break 9 km out, then 7 % down the slope, levelling at 450 m.
  let z = -(1 + 0.005 * s) - 0.07 * Math.max(0, s - 9000);
  z = Math.max(z, -450);
  z += 2.5 * gauss(s - 700, 160);           // nearshore bar
  // Canyon: starts on the shelf off the river mouth and deepens toward the break.
  z -= (25 + 0.03 * s) * gauss(y - RIVER_Y + 0.08 * s, 280 + 0.04 * s) * smooth(800, 4000, s);
  // Island about 6 km offshore: a peak near 90 m with a lower shoulder, and a reef-capped islet.
  const ix = x - (coastX(-4200) - 6000), iy = y + 4200;
  z += 125 * gauss(Math.hypot(ix, iy * 1.3), 520) + 45 * gauss(Math.hypot(ix - 700, iy + 500), 650);
  z += 34 * gauss(Math.hypot(x - (coastX(-7400) - 3600), y + 7400), 300);
  return z + 1.5 * texture(x, y);
}

// Colours: greens to tans on land, light to dark blue with depth (both by true height).
const LAND = [[0, [0.80, 0.76, 0.58]], [6, [0.42, 0.58, 0.32]], [120, [0.33, 0.48, 0.26]], [260, [0.55, 0.47, 0.34]]];
const SEA = [[0, [0.62, 0.80, 0.82]], [-25, [0.33, 0.62, 0.74]], [-120, [0.16, 0.38, 0.62]], [-450, [0.06, 0.13, 0.32]]];
function ramp(stops, h) {
  for (let i = 1; i < stops.length; i++) {
    const [h0, c0] = stops[i - 1], [h1, c1] = stops[i];
    if ((h - h0) * (h - h1) <= 0) { const t = (h - h0) / (h1 - h0); return c0.map((v, k) => v + (c1[k] - v) * t); }
  }
  return stops[stops.length - 1][1];
}

let mesh = null;
let sea = null;
let builtMpu = null;
let builtExag = null;
function build() {
  const mpu = +sel('scale').value, exag = +sel('exag').value;
  if (mesh) { scene.remove(mesh); mesh.geometry.dispose(); }
  if (sea) { scene.remove(sea); sea.geometry.dispose(); }
  const g = new THREE.PlaneGeometry(SPAN_M / mpu, SPAN_M / mpu, N - 1, N - 1);
  g.rotateX(-Math.PI / 2);
  const pos = g.attributes.position;
  const col = new Float32Array(pos.count * 3);
  for (let i = 0; i < pos.count; i++) {
    const h = heightAt(pos.getX(i) * mpu, -pos.getZ(i) * mpu);
    pos.setY(i, (h * exag) / mpu);
    col.set(h >= 0 ? ramp(LAND, h) : ramp(SEA, h), i * 3);
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.computeVertexNormals();
  mesh = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide }));
  scene.add(mesh);
  // Sea surface at 0 m: translucent, so the seabed shows through and you can dive under it.
  sea = new THREE.Mesh(
    new THREE.PlaneGeometry(SPAN_M / mpu, SPAN_M / mpu).rotateX(-Math.PI / 2),
    new THREE.MeshBasicMaterial({ color: 0x3a7fb0, transparent: true, opacity: 0.28, depthWrite: false, side: THREE.DoubleSide }),
  );
  sea.visible = sel('sea').checked;
  scene.add(sea);
  builtMpu = mpu; builtExag = exag;
  sel('exag-val').textContent = exag + 'x';
}

// 'KeyW' -> 'W', 'ArrowUp' -> 'Up', 'ShiftLeft' -> 'Shift'
const keyName = (k) => k.startsWith('Arrow') ? k.slice(5) : k.replace(/^Key/, '').replace(/(Left|Right)$/, '');

let nav = null;
function makeNav() {
  if (nav) nav.dispose();
  const mpu = +sel('scale').value;
  const modes = sel('modes').value.split(',');
  const mode = modes.includes(startMode) ? startMode : modes[0];
  nav = createVantage({
    THREE, CameraControls, camera, dom: canvas,
    origin: ORIGIN, metresPerUnit: mpu,
    exaggeration: () => builtExag,
    modes, mode,
    settingsKey: 'vantagekit-demo.fly',
    // Fly speed scales with height above the land, the seabed or, over water, the sea surface.
    surfaceAt: (x, z) => (Math.max(0, heightAt(x * mpu, -z * mpu)) * builtExag) / mpu,
    mouse: sel('mouse').value,
    link: sel('link').checked && {
      app: {
        write(p) {
          p.set('modes', sel('modes').value);
          p.set('mode', nav.mode);
          p.set('mouse', sel('mouse').value);
          p.set('mpu', sel('scale').value);
          p.set('ex', sel('exag').value);
        },
      },
    },
  });
  nav.addEventListener('input', (e) => { lastInput = e.detail.kind; });
  nav.addEventListener('gamepad', (e) => { padName = e.detail.connected ? e.detail.id : 'none'; });
  nav.addEventListener('modechange', (e) => { startMode = e.detail.mode; showMode(); });
  sel('keys').innerHTML = nav.bindings
    .map((b) => `<li><b>${[...b.keys.map(keyName), b.pad].filter(Boolean).filter((v, i, a) => a.indexOf(v) === i).join(', ')}</b>: ${b.label}</li>`)
    .join('');
  sel('sens').value = nav.fly.sensitivity;
  sel('invert').checked = nav.fly.invertY;
  showMode();
}

function showMode() {
  const fly = nav.mode === 'fly', both = nav.modes.length > 1;
  sel('fly').textContent = fly ? 'Orbit (F or Esc)' : 'Fly (F)';
  sel('fly').disabled = !both;
  sel('fly-hint').textContent = fly
    ? 'Click the scene to capture the mouse (or drag to look). The wheel sets the speed.'
    : (both ? '' : 'This page offers orbit only.');
  sel('sens-val').textContent = `${(+sel('sens').value).toFixed(2)} deg/px`;
}

let lastInput = 'none', padName = 'none';
// Home: from offshore in the south-west, looking north-east toward the coast.
function frameHome() {
  nav.fitBox(new THREE.Box3().setFromObject(mesh), { bearingDeg: 60, elevationDeg: 35, factor: 0.8 });
  nav.saveHome();
}
function frame() {
  build();
  makeNav();
  frameHome();
  nav.readLink();
  nav.applyLink();
}
// Rebuild the controller for a changed page setting, keeping the current view.
function remake({ rebuild = false } = {}) {
  const v = nav.view();
  startMode = nav.mode;
  if (rebuild) build();
  makeNav();
  frameHome();
  nav.setView(v);
  nav.applyLink();
  nav.writeLink();
}

sel('fly').addEventListener('click', () => nav.setMode(nav.mode === 'fly' ? 'orbit' : 'fly'));
sel('sens').addEventListener('input', () => { nav.setFlySettings({ sensitivity: +sel('sens').value }); showMode(); });
sel('invert').addEventListener('change', () => nav.setFlySettings({ invertY: sel('invert').checked }));
sel('modes').addEventListener('change', () => remake());
sel('mouse').addEventListener('change', () => remake());
sel('scale').addEventListener('change', () => remake({ rebuild: true }));
sel('exag').addEventListener('input', () => {
  const prev = builtExag;
  const t = nav.getTarget();
  build();
  nav.rescaleVertical(prev, builtExag, t.y);
  nav.writeLink();
});
sel('sea').addEventListener('change', () => { sea.visible = sel('sea').checked; });
sel('link').addEventListener('change', () => remake());

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

frame();
resize();
const clock = new THREE.Clock();
let frames = 0;
renderer.setAnimationLoop(() => {
  const moved = nav.update(clock.getDelta());
  renderer.render(scene, camera);
  if (moved || frames++ % 30 === 0) {
    const v = nav.view(), i = nav.viewInfo();
    sel('status').textContent =
      `range ${Math.round(i.rangeMetres)} m, ${i.metresPerPixelAtTarget.toFixed(1)} m/px\n` +
      `bearing ${v.bearing.toFixed(0)}, pitch ${v.pitch.toFixed(0)}\n` +
      `${nav.mode}${nav.mode === 'fly' ? `, speed x${i.flySpeedMultiplier.toFixed(2)}` : ''}\n` +
      `input ${lastInput}, pad ${padName}`;
  }
});
window.vantage = () => nav;   // for debugging in the console
</script>
</body>
</html>
